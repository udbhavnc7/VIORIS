[project]
name = "vioris"
version = "0.1.0"
description = "Private, voice-first personal operating agent"
requires-python = ">=3.11"
dependencies = [
    # API / Backend
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.7",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",

    # Task queue
    "celery>=5.4",
    "redis>=5.0",

    # Voice / Audio
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "webrtcvad>=2.0.10",
    "sounddevice>=0.4",
    "numpy>=1.26",

    # LLM (local)
    "ollama>=0.3",

    # Remote access (Phase 5 — device pairing)
    "pyjwt>=2.9",
    "cryptography>=42.0",

    # Utilities
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
browser = [
    "playwright>=1.45",
]
vision = [
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]
voiceprint = [
    "resemblyzer>=0.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
