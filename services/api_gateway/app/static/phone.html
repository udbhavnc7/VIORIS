<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Vioris</title>
<style>
:root {
  --bg: #0a0e14;
  --surface: #141a22;
  --surface2: #1c2430;
  --border: #2a3444;
  --text: #e8edf3;
  --dim: #6b7a8d;
  --accent: #4da6ff;
  --accent-glow: rgba(77, 166, 255, 0.25);
  --ok: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --ring-pulse: rgba(77, 166, 255, 0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Status bar ─────────────────────────────────────────────────────────── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.6rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 0.75rem;
  color: var(--dim);
  position: sticky;
  top: 0;
  z-index: 100;
}
.status-bar .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--bad);
  display: inline-block;
  margin-right: 0.4rem;
}
.status-bar .dot.on { background: var(--ok); }
.status-bar .title { font-weight: 600; color: var(--text); }

/* ── Screen: idle ───────────────────────────────────────────────────────── */
.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

#screen-idle {
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 2rem;
  text-align: center;
}
#screen-idle .logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  box-shadow: 0 0 40px var(--accent-glow);
}
#screen-idle h1 { font-size: 1.5rem; font-weight: 600; }
#screen-idle p { color: var(--dim); font-size: 0.9rem; }
#screen-idle .next-digest {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.5rem;
  font-size: 0.85rem;
  color: var(--dim);
}
#screen-idle .next-digest strong { color: var(--text); }

/* ── Screen: ringing ────────────────────────────────────────────────────── */
#screen-ringing {
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 2rem;
  text-align: center;
}
.ring-avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  position: relative;
  animation: ring-pulse 1.5s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--ring-pulse); }
  50% { box-shadow: 0 0 0 20px transparent; }
}
.ring-info h2 { font-size: 1.3rem; font-weight: 600; }
.ring-info p { color: var(--dim); font-size: 0.9rem; margin-top: 0.3rem; }
.ring-actions {
  display: flex;
  gap: 2rem;
  margin-top: 1rem;
}
.ring-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.1s;
}
.ring-btn:active { transform: scale(0.9); }
.ring-btn.accept { background: var(--ok); color: #fff; }
.ring-btn.decline { background: var(--bad); color: #fff; }

/* ── Screen: active call ────────────────────────────────────────────────── */
#screen-active {
  flex-direction: column;
  height: 100dvh;
}
.call-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.call-header .avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
}
.call-header .info { flex: 1; }
.call-header .info .name { font-weight: 600; font-size: 0.9rem; }
.call-header .info .status { font-size: 0.75rem; color: var(--ok); }
.call-header .timer { font-size: 0.8rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.call-header .end-btn {
  background: var(--bad);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  font-size: 1rem;
  cursor: pointer;
}

/* ── Messages area ──────────────────────────────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.msg {
  max-width: 80%;
  padding: 0.7rem 1rem;
  border-radius: 16px;
  font-size: 0.9rem;
  line-height: 1.4;
  animation: msg-in 0.2s ease-out;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.laptop {
  align-self: flex-start;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg.phone {
  align-self: flex-end;
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.msg.system {
  align-self: center;
  background: transparent;
  color: var(--dim);
  font-size: 0.8rem;
  padding: 0.3rem 0;
}

/* ── Digest items ───────────────────────────────────────────────────────── */
.digest-items {
  padding: 0 1rem 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.digest-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.7rem 1rem;
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
}
.digest-item .icon {
  font-size: 1.2rem;
  flex-shrink: 0;
  margin-top: 0.1rem;
}
.digest-item .content { flex: 1; }
.digest-item .content .type {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--dim);
}
.digest-item .content .summary { font-size: 0.85rem; margin-top: 0.15rem; }
.digest-item.actionable { border-color: var(--accent); }

/* ── Approval card ──────────────────────────────────────────────────────── */
.approval-card {
  background: var(--surface);
  border: 2px solid var(--warn);
  border-radius: 12px;
  padding: 1rem;
  margin: 0 1rem 0.5rem;
}
.approval-card .label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--warn);
  margin-bottom: 0.5rem;
}
.approval-card .desc { font-size: 0.9rem; margin-bottom: 0.75rem; }
.approval-card .actions { display: flex; gap: 0.5rem; }
.approval-card .actions button {
  flex: 1;
  padding: 0.6rem;
  border-radius: 8px;
  border: none;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.approval-card .btn-approve { background: var(--ok); color: #fff; }
.approval-card .btn-reject { background: var(--bad); color: #fff; }

/* ── Input bar ──────────────────────────────────────────────────────────── */
.input-bar {
  display: flex;
  gap: 0.5rem;
  padding: 0.75rem 1rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  align-items: flex-end;
}
.input-bar textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.6rem 1rem;
  color: var(--text);
  font-size: 0.9rem;
  font-family: inherit;
  resize: none;
  max-height: 100px;
  outline: none;
}
.input-bar textarea:focus { border-color: var(--accent); }
.input-bar .send-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 1.1rem;
  cursor: pointer;
  flex-shrink: 0;
}
.input-bar .voice-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 1.1rem;
  cursor: pointer;
  flex-shrink: 0;
}
.input-bar .voice-btn.recording {
  background: var(--bad);
  border-color: var(--bad);
  color: #fff;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* ── Quick replies ──────────────────────────────────────────────────────── */
.quick-replies {
  display: flex;
  gap: 0.4rem;
  padding: 0 1rem 0.5rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.quick-replies::-webkit-scrollbar { display: none; }
.quick-reply {
  flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.4rem 0.9rem;
  font-size: 0.8rem;
  color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
}
.quick-reply:active { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<!-- Status bar -->
<div class="status-bar">
  <span><span class="dot" id="ws-dot"></span><span class="title">Vioris</span></span>
  <span id="ws-status">Connecting...</span>
</div>

<!-- Screen: Idle -->
<div class="screen active" id="screen-idle">
  <div class="logo">V</div>
  <h1>Vioris</h1>
  <p>Ready and listening</p>
  <div class="next-digest" id="next-digest">
    Next digest at <strong id="next-digest-time">--:--</strong>
  </div>
</div>

<!-- Screen: Ringing -->
<div class="screen" id="screen-ringing">
  <div class="ring-avatar">V</div>
  <div class="ring-info">
    <h2 id="ring-caller">Vioris</h2>
    <p id="ring-reason">Proactive digest</p>
  </div>
  <div class="ring-actions">
    <button class="ring-btn decline" onclick="declineCall()">✕</button>
    <button class="ring-btn accept" onclick="acceptCall()">📞</button>
  </div>
</div>

<!-- Screen: Active Call -->
<div class="screen" id="screen-active">
  <div class="call-header">
    <div class="avatar">V</div>
    <div class="info">
      <div class="name">Vioris</div>
      <div class="status" id="call-status-text">Active</div>
    </div>
    <div class="timer" id="call-timer">00:00</div>
    <button class="end-btn" onclick="endCall()">✕</button>
  </div>

  <div class="digest-items" id="digest-items"></div>
  <div class="messages" id="messages"></div>
  <div class="quick-replies" id="quick-replies">
    <div class="quick-reply" onclick="sendQuick('open mail, send a mail to shravan saying Hi Sceptix')">📧 Send mail to Shravan: Hi Sceptix</div>
    <div class="quick-reply" onclick="sendQuick('shravan gk')">👤 Shravan GK</div>
    <div class="quick-reply" onclick="sendQuick('Yes, go on, also tell me which mails have I received, are there any texts from Disha?')">Yes, go on (check mail & Disha)</div>
    <div class="quick-reply" onclick="sendQuick('don\'t reply to the mail, just react with a thumbs up, and also tell Disha I\'ll be reaching in another hour')">React 👍 & tell Disha 1 hr</div>
    <div class="quick-reply" onclick="sendQuick('open mail')">📬 Open mail</div>
    <div class="quick-reply" onclick="sendQuick('bye')">Bye</div>
  </div>
  <div class="input-bar">
    <button class="voice-btn" id="voice-btn" onclick="toggleVoice()">🎤</button>
    <textarea id="text-input" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" onclick="sendText()">↑</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let ws = null;
let callId = null;
let callStartTime = null;
let timerInterval = null;
let recognition = null;
let isRecording = false;

// ── Elements ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const screens = {
  idle: $('screen-idle'),
  ringing: $('screen-ringing'),
  active: $('screen-active'),
};

// ── Screen management ──────────────────────────────────────────────────────
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function connect() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || localStorage.getItem('vioris_token') || '';

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/device?type=phone&token=${token}`;

  ws = new WebSocket(url);

  ws.onopen = () => {
    $('ws-dot').classList.add('on');
    $('ws-status').textContent = 'Connected';
  };

  ws.onclose = () => {
    $('ws-dot').classList.remove('on');
    $('ws-status').textContent = 'Disconnected';
    setTimeout(connect, 3000);
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch {}
  };
}

function playRingTone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch {}
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const clean = text.replace(/<[^>]*>/g, '').trim();
    const utt = new SpeechSynthesisUtterance(clean);
    utt.rate = 1.0;
    utt.lang = 'en-US';
    window.speechSynthesis.speak(utt);
  } catch (err) {
    console.warn('TTS error:', err);
  }
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'ring':
      callId = msg.payload.call_id;
      $('ring-caller').textContent = msg.payload.caller_name || 'Vioris';
      $('ring-reason').textContent = msg.payload.reason || 'Proactive digest';
      showScreen('ringing');
      playRingTone();
      break;

    case 'digest':
      if (msg.payload.call_id) callId = msg.payload.call_id;
      if (msg.payload.items) renderDigestItems(msg.payload.items);
      if (msg.payload.text) {
        addMessage('laptop', msg.payload.text);
        speakText(msg.payload.text);
      }
      showScreen('active');
      startTimer();
      break;

    case 'voice_response':
      if (msg.payload.text) {
        addMessage('laptop', msg.payload.text);
        speakText(msg.payload.text);
      }
      if (msg.payload.action) handleAction(msg.payload.action);
      break;

    case 'approval_request':
      showApprovalCard(msg.payload);
      break;
  }
}

// ── Digest items ───────────────────────────────────────────────────────────
function renderDigestItems(items) {
  const container = $('digest-items');
  container.innerHTML = '';
  const icons = { email: '📧', message: '💬', calendar: '📅', task: '✅' };
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'digest-item' + (item.actionable ? ' actionable' : '');
    div.innerHTML = `
      <div class="icon">${icons[item.item_type] || '📋'}</div>
      <div class="content">
        <div class="type">${item.item_type}</div>
        <div class="summary">${item.summary}</div>
      </div>`;
    container.appendChild(div);
  });
}

// ── Messages ───────────────────────────────────────────────────────────────
function addMessage(role, text) {
  const container = $('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ── Send ───────────────────────────────────────────────────────────────────
function sendText() {
  const input = $('text-input');
  const text = input.value.trim();
  if (!text || !callId) return;
  addMessage('phone', text);
  ws.send(JSON.stringify({ type: 'voice', payload: { call_id: callId, text } }));
  input.value = '';
  input.style.height = 'auto';
}

function sendQuick(text) {
  if (!callId) return;
  addMessage('phone', text);
  ws.send(JSON.stringify({ type: 'voice', payload: { call_id: callId, text } }));
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
}

// ── Call actions ───────────────────────────────────────────────────────────
function acceptCall() {
  if (!callId) return;
  ws.send(JSON.stringify({ type: 'call_accept', payload: { call_id: callId } }));
}

function declineCall() {
  if (!callId) return;
  ws.send(JSON.stringify({ type: 'call_end', payload: { call_id: callId } }));
  callId = null;
  showScreen('idle');
}

function endCall() {
  if (!callId) return;
  ws.send(JSON.stringify({ type: 'call_end', payload: { call_id: callId } }));
  callId = null;
  stopTimer();
  $('messages').innerHTML = '';
  $('digest-items').innerHTML = '';
  showScreen('idle');
}

// ── Approval card ──────────────────────────────────────────────────────────
function showApprovalCard(payload) {
  const container = $('messages');
  const div = document.createElement('div');
  div.className = 'approval-card';
  div.innerHTML = `
    <div class="label">⚠ Action requires approval</div>
    <div class="desc">${payload.description || payload.tool || 'Unknown action'}</div>
    <div class="actions">
      <button class="btn-reject" onclick="respondApproval('${payload.action_id}', 'reject', this)">Reject</button>
      <button class="btn-approve" onclick="respondApproval('${payload.action_id}', 'approve', this)">Approve</button>
    </div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function respondApproval(actionId, response, btn) {
  ws.send(JSON.stringify({
    type: response,
    payload: { call_id: callId, action_id: actionId }
  }));
  btn.closest('.approval-card').remove();
}

function handleAction(action) {
  if (action.type === 'approve' || action.type === 'reject') {
    showApprovalCard({ action_id: action.action_id, description: action.description });
  }
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer() {
  callStartTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    $('call-timer').textContent = `${m}:${s}`;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  $('call-timer').textContent = '00:00';
}

// ── Voice input (Web Speech API) ──────────────────────────────────────────
function toggleVoice() {
  if (isRecording) {
    stopVoice();
  } else {
    startVoice();
  }
}

function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    addMessage('system', 'Speech recognition not supported in this browser');
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    $('text-input').value = text;
    stopVoice();
    sendText();
  };

  recognition.onerror = () => stopVoice();
  recognition.onend = () => stopVoice();

  recognition.start();
  isRecording = true;
  $('voice-btn').classList.add('recording');
}

function stopVoice() {
  if (recognition) {
    try { recognition.stop(); } catch {}
  }
  isRecording = false;
  $('voice-btn').classList.remove('recording');
}

// ── Next digest time ──────────────────────────────────────────────────────
function updateNextDigest() {
  const now = new Date();
  const hours = [8, 13, 18];
  for (const h of hours) {
    const t = new Date(now);
    t.setHours(h, 0, 0, 0);
    if (t > now) {
      $('next-digest-time').textContent = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return;
    }
  }
  // Tomorrow 8am
  const t = new Date(now);
  t.setDate(t.getDate() + 1);
  t.setHours(8, 0, 0, 0);
  $('next-digest-time').textContent = 'Tomorrow ' + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Auto-resize textarea ──────────────────────────────────────────────────
$('text-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// ── Init ──────────────────────────────────────────────────────────────────
connect();
updateNextDigest();
setInterval(updateNextDigest, 60000);
</script>
</body>
</html>
