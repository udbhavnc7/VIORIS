services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vioris-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vioris
      POSTGRES_USER: vioris
      POSTGRES_PASSWORD: vioris_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vioris"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vioris-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
